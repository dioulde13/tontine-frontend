    <app-modal title="Nouvelle pénalité manuelle" size="md" (closed)="closed.emit()">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" id="penalite-form" class="form-grid">
        <div class="field field-full">
          <label class="field-label" for="utilisateurId">Membre<span class="required">*</span></label>
          <app-autocomplete-select
            inputId="utilisateurId"
            placeholder="Rechercher un membre…"
            [options]="membreOptions()"
            formControlName="utilisateurId"
          />
        </div>
        <div class="field">
          <label class="field-label" for="montant">Montant (GNF)<span class="required">*</span></label>
          <input id="montant" type="number" min="0" class="input" formControlName="montant" />
        </div>
        <div class="field">
          <label class="field-label" for="date">Date<span class="required">*</span></label>
          <input id="date" type="date" class="input" formControlName="date" />
        </div>
        <div class="field field-full">
          <label class="field-label" for="statut">Statut</label>
          <select id="statut" class="select" formControlName="statut">
            <option value="NON_PAYEE">Non payée</option>
            <option value="PAYEE">Payée</option>
          </select>
        </div>
      </form>
      <div modalFooter>
        <button type="button" class="btn btn-secondary" (click)="closed.emit()">Annuler</button>
        <button type="submit" form="penalite-form" class="btn btn-primary" [disabled]="form.invalid || saving()">
          {{ saving() ? 'Enregistrement…' : 'Enregistrer' }}
        </button>
      </div>
    </app-modal>
